window.register = async function () {

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    if (name === "") {
        alert("Enter Your Name");
        return;
    }

    if (email === "") {
        alert("Enter Email Address");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
    }

    try {

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );
            await updateProfile(userCredential.user, {
    displayName: name
});

        await sendEmailVerification(userCredential.user);

        await set(
            ref(db, "users/" + userCredential.user.uid),
            {
                uid: userCredential.user.uid,
                name: name,
                email: email,
                createdAt: Date.now(),
                online: false,
                lastSeen:Date.now()
            }
        );

        alert(
            "Account Created Successfully!\n\nPlease verify your email before login."
        );

    } catch (error) {

        alert(error.message);

    }

};

window.openPrivateChat = function(uid, name){

    selectedUserId = uid;
    selectedUserName = name;

    currentChatRoom = getChatRoomId(
        auth.currentUser.uid,
        uid
    );

    document.getElementById("chatTitle").innerHTML = name;
    document.getElementById("chatAvatar").innerHTML =
name.charAt(0).toUpperCase();

    document.getElementById("home").style.display = "none";
    document.getElementById("chatScreen").style.display = "block";
    history.pushState({page:"chat"}, "", "");

    document.getElementById("messages").innerHTML = "";
    
    const badge = document.getElementById("badge_"+uid);

if(badge){

    badge.style.display="none";

}

    loadPrivateMessages();
    listenUserStatus();
    listenTypingStatus();

window.listenTypingStatus = function(){

    if(!selectedUserId) return;

    onValue(
        ref(db,"typing/"+currentChatRoom+"/"+selectedUserId),
        (snapshot)=>{

            const data=snapshot.val();

            if(data && data.typing){

                document.getElementById("chatStatus").innerHTML="✍️ Typing...";

            }else{

                onValue(
                    ref(db,"users/"+selectedUserId),
                    (snap)=>{

                        const user=snap.val();

                        if(user && user.online){

                            document.getElementById("chatStatus").innerHTML="🟢 Online";

                        }else{

                            document.getElementById("chatStatus").innerHTML="⚫ Offline";

                        }

                    }
                );

            }

        }
    );

}

}

    if(!selectionMode) return;

    if(selectedMessages.includes(key)){

        selectedMessages =

    }else{

        selectedMessages.push(key);

function getChatRoomId(uid1, uid2){

    return [uid1, uid2].sort().join("_");

}
function formatTime(time){

    const d = new Date(time);

    return d.toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
    });

}

});

window.clearSelection = function(){

    selectionMode = false;
    selectedMessages = [];

    document.querySelectorAll("#messages > div").forEach(msg=>{

        msg.style.outline = "none";

        if(msg.style.marginLeft=="auto"){

            msg.style.background="#DCF8C6";

        }else{

            msg.style.background="#FFFFFF";

        }

    });

    updateSelectionBar();

}

window.copySelectedMessage = async function(){


    if(selectedMessages.length != 1){

        alert("Please select only one message.");
        return;

    }

    const msg = document.querySelector(
        '[data-key="'+selectedMessages[0]+'"]'
    );

    if(!msg) return;

    await navigator.clipboard.writeText(
        msg.dataset.text
    );

    alert("Message Copied 📋");

    clearSelection();

}

window.openMessageMenu = function(){

    if(selectedMessages.length==0){
        return;
    }

    document.getElementById("messageMenu").style.display="block";

}


window.closeMessageMenu = function(){

    document.getElementById("messageMenu").style.display="none";
    clearSelection();

}



window.deleteSelectedMessages = async function(type){

    if(selectedMessages.length==0) return;


    for(let id of selectedMessages){

        let messageRef = ref(
            db,
            "chats/"+currentChatRoom+"/"+id
        );


if(type=="everyone"){

    await update(messageRef,{
        text:"This message was deleted",
        image:null,
        deleted:true
    });

}
else{

    await update(messageRef,{
        ["deletedFor/" + auth.currentUser.uid]: true
    });

}

    }


    selectedMessages=[];
    selectionMode=false;
    
    clearSelection();
    loadPrivateMessages();
    
    document.getElementById("messageMenu").style.display="none";

    updateSelectionBar();

}
window.starSelectedMessage = async function(){

    if(selectedMessages.length != 1){
        alert("Please select only one message.");
        return;
    }

    const messageRef = ref(
        db,
        "chats/" + currentChatRoom + "/" + selectedMessages[0]
    );

    await update(messageRef,{
        starred:true
    });
console.log("Selected:", selectedMessages[0]);

    clearSelection();
    
    loadPrivateMessages();

}
window.replySelectedMessage = function(){

    if(selectedMessages.length != 1){
        alert("Please select only one message.");
        return;
    }

    const messageRef = ref(
        db,
        "chats/" + currentChatRoom + "/" + selectedMessages[0]
    );

    get(messageRef).then((snapshot)=>{

        const data = snapshot.val();

        if(!data) return;

        if(data.sender == auth.currentUser.uid){

            alert("❌ You can only reply to other person's messages.");

            clearSelection();
            return;
        }

        replyMessageId = selectedMessages[0];
        replyMessageText = data.text || "📷 Photo";

        document.getElementById("replyText").innerHTML = replyMessageText;
        document.getElementById("replyBox").style.display = "block";

        clearSelection();

    });

}
window.cancelReply = function(){

    replyMessageId = "";
    replyMessageText = "";

    document.getElementById("replyBox").style.display = "none";
    document.getElementById("replyText").innerHTML = "";

}
</script>
